[tool.poetry]
name = "dicom-data-explorer"
version = "0.1.0"
description = "DICOM data explorer app"
readme = "README.md"
packages = [{ include = "dicom_data_explorer" }]

[tool.poetry.dependencies]
# 3.11 floor: Reflex 0.10 and the re_ddns smart-launcher image (python:3.11).
# <3.15 cap: duckdb (1.5.6) has no CPython 3.15 wheels yet.
python = ">=3.11,<3.15"
duckdb = "*"
reflex = "0.10.0"
reflex-ddns-auth = {path = "../reflex_ddns_auth", develop = true}
pandas = "*"
idc-index = ">=0.6.0"
idc-index-data = "*"
requests = "*"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
